<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Frame / ID Card Silhouette -->
  <rect x="96" y="136" width="320" height="240" rx="28" fill="#1E293B" stroke="url(#cyanGrad)" stroke-width="10" />

  <!-- Top Security Header Bar on Card -->
  <path d="M 106 164 Q 106 146 124 146 L 388 146 Q 406 146 406 164 L 406 184 L 106 184 Z" fill="#0F172A" opacity="0.7" />
  <circle cx="136" cy="165" r="6" fill="#38BDF8" />
  <circle cx="156" cy="165" r="6" fill="#34D399" />

  <!-- Gold EMV / Biometric eMRTD Chip -->
  <rect x="132" y="212" width="76" height="62" rx="10" fill="url(#goldGrad)" stroke="#FEF3C7" stroke-width="2" />
  <line x1="132" y1="232" x2="208" y2="232" stroke="#78350F" stroke-width="3" />
  <line x1="132" y1="254" x2="208" y2="254" stroke="#78350F" stroke-width="3" />
  <line x1="170" y1="212" x2="170" y2="274" stroke="#78350F" stroke-width="3" />
  <rect x="156" y="228" width="28" height="30" rx="5" fill="url(#goldGrad)" stroke="#78350F" stroke-width="2.5" />

  <!-- Biometric MRZ Lines at Bottom of Card -->
  <rect x="132" y="306" width="160" height="10" rx="5" fill="#64748B" />
  <rect x="132" y="326" width="210" height="10" rx="5" fill="#475569" />
  <rect x="132" y="346" width="120" height="10" rx="5" fill="#38BDF8" />

  <!-- Contactless NFC Radio Waves (Right Side) -->
  <path d="M 265 225 A 35 35 0 0 1 265 275" fill="none" stroke="url(#emeraldGrad)" stroke-width="9" stroke-linecap="round" />
  <path d="M 288 207 A 60 60 0 0 1 288 293" fill="none" stroke="url(#emeraldGrad)" stroke-width="9" stroke-linecap="round" />
  <path d="M 312 189 A 85 85 0 0 1 312 311" fill="none" stroke="url(#cyanGrad)" stroke-width="9" stroke-linecap="round" />
  <path d="M 336 171 A 110 110 0 0 1 336 329" fill="none" stroke="url(#cyanGrad)" stroke-width="9" stroke-linecap="round" opacity="0.85" />
</svg>
