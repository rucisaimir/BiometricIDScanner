name: Build Android APK (.NET 9 MAUI)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Android Workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Generate Android Signing Keystore
        run: |
          rm -f biometric.keystore
          keytool -genkeypair -v -keystore biometric.keystore -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Saimir Ruci, OU=Dev, O=Albania, L=Berat, S=Berat, C=AL"

      - name: Publish Signed Android APK
        run: |
          dotnet publish BiometricIDScanner.csproj -f net9.0-android -c Release -p:CheckEolTargetFramework=false -p:AndroidPackageFormat=apk -p:AndroidKeyStore=true -p:AndroidSigningKeyStore=biometric.keystore -p:AndroidSigningKeyAlias=androidkey -p:AndroidSigningKeyPass=123456 -p:AndroidSigningStorePass=123456

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: BiometricIDScanner-Android-APK
          path: |
            bin/Release/net9.0-android/publish/*Signed.apk
            bin/Release/net9.0-android/*Signed.apk
